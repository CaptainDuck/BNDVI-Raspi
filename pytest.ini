; Test config lives at the repo root so `pytest` works from anywhere, matching how
; the two entry points already behave. The tests themselves are under
; hylocropter/tests/ and put hylocropter/ on sys.path via their conftest, because
; the app's modules import each other flat rather than as a package.
[pytest]
testpaths = hylocropter/tests
addopts = -q --strict-markers
filterwarnings =
    error::RuntimeWarning
